# Configuracao de deploy no Fly.io (https://fly.io).
# A base de dados SQLite vive num volume persistente montado em /data.
#
# Passos (uma vez):
#   1. Instala o flyctl e faz login:  fly auth login
#   2. Cria a app (usa este nome ou muda-o):  fly apps create appdoivo
#   3. Cria o volume persistente na mesma regiao:
#        fly volumes create appdoivo_data --region cdg --size 1
#   4. Define os segredos (NAO ficam no repositorio):
#        fly secrets set TOKEN_SECRET=<32 bytes hex> ADMIN_NAME=Ivo `
#          VAPID_PUBLIC_KEY=... VAPID_PRIVATE_KEY=... VAPID_SUBJECT=mailto:tu@exemplo.pt
#   5. Deploy:  fly deploy
#
# Notas:
#   - PORT fica abaixo em [env] (nao e segredo). O fuso horario da app e
#     fixo (Europe/Lisbon, ver getTimezone() em src/time.js), nao e uma
#     variavel de ambiente.
#   - ADMIN_TOKEN nao tem efeito aqui (NODE_ENV=production abaixo ignora-o
#     de proposito, ver seed() em src/db.js) - a chave real do dono e
#     gerada automaticamente, tal como a de qualquer utilizador. Consulta-a
#     com "npm run admin-token" (ou "fly ssh console -C 'node scripts/print-admin-token.js'").
#   - min_machines_running = 1 mantem a maquina acordada para a revelacao
#     da Rata (a cada 3h) funcionar mesmo sem trafego. Poe 0 fora dos eventos
#     para poupar (mas ai o cron so corre quando houver visitas).

app = "appdoivo"
primary_region = "cdg"

# No swap here on purpose, and this note is so nobody adds it back expecting
# it to work. A Fly machine has no swap by default, which would be a useful
# backstop under the memo video, but swap_size_mb is not a key this flyctl
# (v0.4.74) understands: it validates clean, then gets dropped from the
# resolved config without a word, and the deployed machine reports no swap.
# The video was fixed where it actually broke instead - the stitch is two
# passes now and peaks around 102MB whatever the phone shot (see
# buildDayRecapVideo in src/memo.js). If more headroom is ever wanted, the
# honest lever is the memory line below, which is real and verifiable.


[build]

[env]
  # Hard ceiling on translation API calls per day, enforced by the app on
  # itself (see DAILY_CAP in translate.js). Sized against real need rather
  # than round numbers: a party day produces roughly 60 translatable things
  # - the day's rata consequences, a handful of Wall posts, a chat pruned to
  # 20 messages - so 300 is about five times the busiest plausible day and
  # bounds a runaway to well under a euro instead of an account.
  #
  # If it ever trips, the log says so plainly and the app degrades to
  # exactly what it does with no API key: originals everywhere, nothing
  # broken. Raise it here rather than removing it.
  TRANSLATION_DAILY_CAP = "300"
  PORT = "3000"
  DB_FILE = "/data/app.sqlite"
  NODE_ENV = "production"
  # Lets the owner promote/revoke other real users to admin ("tester")
  # in production. The golden rule (only the owner sees access keys) is
  # unaffected - that's enforced separately in src/routes.js regardless
  # of this flag.
  ENABLE_ADMIN_PROMOTION = "true"
  # Wall (announcements/polls, internal name "plaza") stayed QA-only
  # while it was being rebuilt - fully redesigned, tested, and approved
  # on QA, so it's on for the real event now too.
  ENABLE_PLAZA = "true"
  # Memo is on here so it can be used and tested on prod, but its random
  # prompts stay silent until the 17th (see memoScheduleActive() in memo.js) -
  # the day before the party, deliberately: enough margin to catch a problem
  # while it is still fixable, without pinging everyone for a whole week
  # beforehand.
  # Without this the cron would push 5 notifications a day to every guest
  # from now until 18 September - people would mute the app before the event
  # it exists for. The owner's manual "open the next moment" trigger still
  # works meanwhile, which is what makes prod testable.
  ENABLE_MEMO = "true"
  # Was 2026-09-17 - the day before the party, so guests got a day's margin
  # rather than a week of notifications. Brought forward to the 13th at
  # Ivo's request so friends can test Memo alongside everything else.
  #
  # Opening it to everyone also starts the scheduler broadcasting (see
  # memoScheduleActive() in memo.js): five pushes a day, inside the
  # 14:00-02:00 window, from now until the party. That is the trade, and it
  # is why the date existed in the first place.
  MEMO_START_DATE = "2026-09-13"

[[mounts]]
  source = "appdoivo_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

# 512MB, not the 256 this ran on until 16 Sept 2026. Memo's "video of the
# day" shells out to ffmpeg, and on 256MB there was nothing left for it:
# Node holds ~130MB of the 212MB a "256MB" machine actually reports, and a
# 480p encode of three photos ran past ten minutes on QA before being
# killed. The request in front of it died at the proxy's 100s limit, which
# is what reached the admin as "publishing the video gives an error".
#
# Changing this file is the part that matters: `fly scale memory` alone
# lasts until the next deploy, which reads this and puts it back.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
