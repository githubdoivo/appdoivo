# Configuracao de deploy no Fly.io (https://fly.io).
# A base de dados SQLite vive num volume persistente montado em /data.
#
# Passos (uma vez):
#   1. Instala o flyctl e faz login:  fly auth login
#   2. Cria a app (usa este nome ou muda-o):  fly apps create appdoivo
#   3. Cria o volume persistente na mesma regiao:
#        fly volumes create appdoivo_data --region cdg --size 1
#   4. Define os segredos (NAO ficam no repositorio):
#        fly secrets set TOKEN_SECRET=<32 bytes hex> ADMIN_NAME=Ivo `
#          VAPID_PUBLIC_KEY=... VAPID_PRIVATE_KEY=... VAPID_SUBJECT=mailto:tu@exemplo.pt
#   5. Deploy:  fly deploy
#
# Notas:
#   - PORT fica abaixo em [env] (nao e segredo). O fuso horario da app e
#     fixo (Europe/Lisbon, ver getTimezone() em src/time.js), nao e uma
#     variavel de ambiente.
#   - ADMIN_TOKEN nao tem efeito aqui (NODE_ENV=production abaixo ignora-o
#     de proposito, ver seed() em src/db.js) - a chave real do dono e
#     gerada automaticamente, tal como a de qualquer utilizador. Consulta-a
#     com "npm run admin-token" (ou "fly ssh console -C 'node scripts/print-admin-token.js'").
#   - min_machines_running = 1 mantem a maquina acordada para a revelacao
#     da Rata (a cada 3h) funcionar mesmo sem trafego. Poe 0 fora dos eventos
#     para poupar (mas ai o cron so corre quando houver visitas).

app = "appdoivo"
primary_region = "cdg"

[build]

[env]
  PORT = "3000"
  DB_FILE = "/data/app.sqlite"
  NODE_ENV = "production"
  # Lets the owner promote/revoke other real users to admin ("tester")
  # in production. The golden rule (only the owner sees access keys) is
  # unaffected - that's enforced separately in src/routes.js regardless
  # of this flag.
  ENABLE_ADMIN_PROMOTION = "true"
  # Wall (announcements/polls, internal name "plaza") stayed QA-only
  # while it was being rebuilt - fully redesigned, tested, and approved
  # on QA, so it's on for the real event now too.
  ENABLE_PLAZA = "true"
  # Memo is on here so it can be used and tested on prod, but its random
  # prompts stay silent until the 17th (see memoScheduleActive() in memo.js) -
  # the day before the party, deliberately: enough margin to catch a problem
  # while it is still fixable, without pinging everyone for a whole week
  # beforehand.
  # Without this the cron would push 5 notifications a day to every guest
  # from now until 18 September - people would mute the app before the event
  # it exists for. The owner's manual "open the next moment" trigger still
  # works meanwhile, which is what makes prod testable.
  ENABLE_MEMO = "true"
  MEMO_START_DATE = "2026-09-17"

[[mounts]]
  source = "appdoivo_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
