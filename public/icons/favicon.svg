<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The cottage from the login illustration, cropped square. Both tunings
       are embedded and swapped with a media query: an SVG favicon is the only
       thing browsers reliably re-evaluate when the OS theme changes (a
       media attribute on <link rel="icon"> is honoured inconsistently, and a
       plain PNG can't respond at all). The light one is the untouched crop;
       the dark one is deepened so it doesn't glow against a dark tab strip. -->
  <style>
    .dark { display: none; }
    @media (prefers-color-scheme: dark) {
      .light { display: none; }
      .dark { display: inline; }
    }
  </style>
  <image class="light" width="32" height="32" href="data:image/png;base64,"/>
  <image class="dark" width="32" height="32" href="data:image/png;base64,"/>
</svg>
