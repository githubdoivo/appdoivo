<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#e7e3d6" />
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg?v=2" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Italianno&display=swap" />
  <link rel="stylesheet" href="/css/styles.css" />
  <title>Admin - appdoivo</title>
</head>
<body>
  <section class="view">
    <header class="topbar">
      <div class="brand">
        <span class="brand-name">appdoivo</span>
        <span id="role-badge" class="badge">admin</span>
      </div>
      <div class="topbar-actions">
        <button id="theme-toggle" class="icon-btn" title="Tema" aria-label="Tema">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" />
          </svg>
        </button>
        <button id="notif-btn" class="icon-btn hidden" title="Notificações" aria-label="Notificações">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" />
            <path d="M13.73 21a2 2 0 0 1-3.46 0" />
          </svg>
        </button>
        <button id="lang-toggle" class="icon-btn lang-toggle" title="Language" aria-label="Language">EN</button>
        <a href="/" class="icon-btn" title="Voltar" aria-label="Voltar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="19" y1="12" x2="5" y2="12" />
            <polyline points="12 19 5 12 12 5" />
          </svg>
        </a>
      </div>
    </header>
    <p id="auth-error" class="error"></p>

    <div id="admin-content" class="hidden">
      <nav class="tabs" id="admin-tabs">
        <button class="tab active" data-atab="users" data-i18n="users_title">Utilizadores</button>
        <button class="tab" data-atab="outfit" data-i18n="tab_outfit">Best Outfit</button>
        <button class="tab" data-atab="rata" data-i18n="tab_rata">A Rata</button>
        <button class="tab" data-atab="wall" data-i18n="tab_chat">Wall</button>
      </nav>

      <!-- Separador: Utilizadores -->
      <div id="atab-users" class="tab-panel">
        <div class="card">
          <form id="user-form" class="inline">
            <input id="user-name-input" type="text" data-i18n-ph="user_name_ph" placeholder="Procura ou cria um utilizador..." autocomplete="off" />
            <button type="submit" class="small" disabled data-i18n="create_user">Criar</button>
          </form>
          <p id="user-search-hint" class="muted hidden" data-i18n="user_search_no_match"></p>
          <div id="users-list" class="user-list"></div>
        </div>

        <div class="card">
          <h2 data-i18n="reset_content_title">Zona perigosa</h2>
          <p class="help" data-i18n="reset_content_help">Explicação</p>
          <button id="reset-content-btn" type="button" class="danger" data-i18n="reset_content_btn">Reiniciar conteúdo do evento</button>
          <span id="reset-content-msg" class="muted"></span>
        </div>
      </div>

      <!-- Separador: Best Outfit -->
      <div id="atab-outfit" class="tab-panel hidden">
        <div class="card">
          <h2 data-i18n="voting_control_title">Controlo da votação</h2>
          <label class="field" data-i18n="night_select_label" style="margin-top:12px">Noite a gerir</label>
          <select id="admin-night">
            <option value="furnished">Furnished</option>
            <option value="swamp">Swamp</option>
          </select>
          <p style="margin-top:12px">
            <span data-i18n="voting_state">Estado atual</span>:
            <strong id="voting-state-label" class="voting-state">--</strong>
          </p>
          <p class="help" data-i18n="reveal_phase_help">Explicação</p>
          <div class="voting-controls" style="margin-top:12px">
            <button type="button" id="voting-open-btn" class="ghost" data-i18n="voting_open_btn">Abrir votação</button>
            <button type="button" id="voting-close-btn" class="ghost" data-i18n="voting_close_btn">Encerrar e publicar</button>
            <button type="button" id="voting-reset-btn" class="ghost" data-i18n="voting_reset_btn">Reiniciar (nova votação)</button>
            <button type="button" id="reveal-next-btn" class="ghost" data-i18n="reveal_next_btn_third">Revelar 3º lugar</button>
          </div>
          <span id="voting-msg" class="muted"></span>
          <span id="reveal-phase-msg" class="muted"></span>
        </div>

        <div class="card">
          <h2 data-i18n="contestants_title">Concorrentes da noite</h2>
          <form id="contestant-form" class="inline" style="margin-top:12px">
            <input id="contestant-name" type="text" data-i18n-ph="contestant_name_ph" placeholder="Nome do concorrente" />
            <button type="submit" class="small" data-i18n="add">Adicionar</button>
          </form>
          <div class="table-scroll"><table id="contestants-table"></table></div>
        </div>

        <div class="card">
          <h2 data-i18n="votes_title">Votos da noite</h2>
          <nav class="tabs" id="votes-night-tabs" style="margin-top:12px">
            <button class="tab active" data-vnight="furnished" data-i18n="theme_furnished">Furnished</button>
            <button class="tab" data-vnight="swamp" data-i18n="theme_swamp">Swamp</button>
          </nav>
          <div class="table-scroll"><table id="votes-table"></table></div>
        </div>
      </div>

      <!-- Separador: A Rata -->
      <div id="atab-rata" class="tab-panel hidden">
        <div class="card">
          <h2 data-i18n="rata_admin_title">A Rata</h2>
          <p class="help" id="reveal-help" data-i18n="rata_admin_help">Explicação</p>
          <button id="reveal-btn" class="small" data-i18n="reveal_now">Revelar consequência</button>
          <span id="reveal-msg" class="muted"></span>
          <div class="table-scroll"><table id="consequences-table" style="margin-top:16px"></table></div>
        </div>

        <div class="card" id="timezone-card">
          <h2 data-i18n="timezone">Fuso horário</h2>
          <form id="settings-form" style="margin-top:12px">
            <input id="timezone" type="text" placeholder="Europe/Lisbon" />
            <button type="submit" style="margin-top:12px" data-i18n="save">Guardar</button>
            <span id="settings-msg" class="muted"></span>
          </form>
        </div>
      </div>

      <!-- Separador: Wall (owner only) -->
      <div id="atab-wall" class="tab-panel hidden">
        <div class="card">
          <h2 data-i18n="wall_pseudonyms_title">Quem é quem na Wall</h2>
          <p class="help" data-i18n="wall_pseudonyms_help">Explicação</p>
          <div class="table-scroll"><table id="wall-pseudonyms-table" style="margin-top:12px"></table></div>
        </div>
      </div>
    </div>
  </section>

  <script type="module" src="/js/admin.js"></script>
</body>
</html>
