# QA/preview deploy config (https://fly.io). Deployed manually from feature
# branches to preview changes before they're merged into main and deployed
# to production via fly.toml. No persistent volume - the database is
# ephemeral on purpose (resets on every deploy/restart), and the machine
# scales to zero when idle, so this costs close to nothing to keep around.
#
# Deploy with:  fly deploy -a appdoivo-qa --config fly.qa.toml

app = "appdoivo-qa"
primary_region = "cdg"

[build]

[env]
  # Hard ceiling on translation API calls per day, enforced by the app on
  # itself (see DAILY_CAP in translate.js). Sized against real need rather
  # than round numbers: a party day produces roughly 60 translatable things
  # - the day's rata consequences, a handful of Wall posts, a chat pruned to
  # 20 messages - so 300 is about five times the busiest plausible day and
  # bounds a runaway to well under a euro instead of an account.
  #
  # If it ever trips, the log says so plainly and the app degrades to
  # exactly what it does with no API key: originals everywhere, nothing
  # broken. Raise it here rather than removing it.
  TRANSLATION_DAILY_CAP = "300"
  PORT = "3000"
  # Only set in QA - labels the version badge "qa v1.2.3" instead of just
  # "v1.2.3", so it's obvious at a glance which environment is open.
  APP_ENV = "qa"
  # Only set in QA - lets admins promote/revoke other users' admin status.
  # Production never sets this; only the owner has admin access there.
  ENABLE_ADMIN_PROMOTION = "true"
  # Only set in QA - the DB is ephemeral here, so auto-load demo/mock data
  # (contestants, votes, consequences) on every boot. Never set in prod.
  SEED_DEMO = "true"
  # Gates the Wall/announcements feature (internal name "plaza", now
  # displayed "Wall") - confirmed ready and on in production too (see
  # fly.toml). Kept here for parity so QA never drifts from what prod
  # actually runs. See routes.js's Plaza section.
  ENABLE_PLAZA = "true"
  # QA-only until tested end-to-end on a real phone and approved (see the
  # Memo feature plan) - not set in fly.toml, so prod stays unaffected.
  # QA has no persistent volume (see header above), so uploaded photos/
  # videos live in the same ephemeral container filesystem as the DB and
  # reset on every deploy - exactly like QA's DB already does, no extra
  # volume needed for QA testing.
  ENABLE_MEMO = "true"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Temporarily 1 instead of the usual 0 (see header) while Memo is being
  # tested: scaling to zero between requests means the per-minute cron that
  # fires Memo's random slots can't run while asleep, so every slot that
  # came due during a nap fires all at once on the next wake-up - looks
  # like several "moments" opening simultaneously, when really they're just
  # queued. Same fix fly.toml already uses for Rata's 3h reveal in prod.
  # Revert to 0 once Memo testing wraps up.
  min_machines_running = 1

# 512MB, not the 256 this ran on until 16 Sept 2026. Memo's "video of the
# day" shells out to ffmpeg, and on 256MB there was nothing left for it:
# Node holds ~130MB of the 212MB a "256MB" machine actually reports, and a
# 480p encode of three photos ran past ten minutes on QA before being
# killed. The request in front of it died at the proxy's 100s limit, which
# is what reached the admin as "publishing the video gives an error".
#
# Changing this file is the part that matters: `fly scale memory` alone
# lasts until the next deploy, which reads this and puts it back.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
