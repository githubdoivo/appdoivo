# QA/preview deploy config (https://fly.io). Deployed manually from feature
# branches to preview changes before they're merged into main and deployed
# to production via fly.toml. No persistent volume - the database is
# ephemeral on purpose (resets on every deploy/restart), and the machine
# scales to zero when idle, so this costs close to nothing to keep around.
#
# Deploy with:  fly deploy -a appdoivo-qa --config fly.qa.toml

app = "appdoivo-qa"
primary_region = "cdg"

[build]

[env]
  PORT = "3000"
  # Only set in QA - labels the version badge "qa v1.2.3" instead of just
  # "v1.2.3", so it's obvious at a glance which environment is open.
  APP_ENV = "qa"
  # Only set in QA - lets admins promote/revoke other users' admin status.
  # Production never sets this; only the owner has admin access there.
  ENABLE_ADMIN_PROMOTION = "true"
  # Only set in QA - the DB is ephemeral here, so auto-load demo/mock data
  # (contestants, votes, consequences) on every boot. Never set in prod.
  SEED_DEMO = "true"
  # Gates the Wall/announcements feature (internal name "plaza", now
  # displayed "Wall") - confirmed ready and on in production too (see
  # fly.toml). Kept here for parity so QA never drifts from what prod
  # actually runs. See routes.js's Plaza section.
  ENABLE_PLAZA = "true"
  # QA-only until tested end-to-end on a real phone and approved (see the
  # Memo feature plan) - not set in fly.toml, so prod stays unaffected.
  # QA has no persistent volume (see header above), so uploaded photos/
  # videos live in the same ephemeral container filesystem as the DB and
  # reset on every deploy - exactly like QA's DB already does, no extra
  # volume needed for QA testing.
  ENABLE_MEMO = "true"
  # Only set in QA - lets the "mossy" quick-login work (see auth.js).
  # Deliberately absent from fly.toml so it defaults to off on prod even
  # if this variable somehow failed to reach the container, rather than
  # relying on NODE_ENV!=='production' the way this used to.
  ENABLE_DEV_LOGIN = "true"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
