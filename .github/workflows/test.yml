name: Test

# The merge-safety gate: a red check on a PR means that branch isn't safe
# to merge to main. Runs on every PR update (any push to a branch with an
# open PR triggers this), plus directly on pushes to main itself (the rare
# direct-push case, e.g. a hotfix - see CONTRIBUTING.md). Deliberately NOT
# on every push to every branch - that doubled up with the pull_request
# run for anything with an open PR already, and fired (and emailed) on
# WIP commits that were never going near main yet.
on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Memo's "video of the day" shells out to ffmpeg (see
      # buildDayRecapVideo() in src/memo.js), same as the runtime image does
      # - installed explicitly rather than leaning on whatever the runner
      # image happens to preinstall.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - run: npm install

      # UI suite drives the app with Playwright's WebKit engine (see
      # test/ui.test.js) - needs the browser binaries, not just the npm
      # package.
      - run: npx playwright install --with-deps webkit chromium

      # --test-concurrency=1 (see the test:ci script): node's default runs
      # the api and ui files in parallel, and a 2-core runner driving the
      # full WebKit matrix at the same time starves the browser badly enough
      # that loginPage() times out even at the 25s CI timeout. Locally, with
      # cores to spare, the parallel default stays.
      - run: npm run test:ci
